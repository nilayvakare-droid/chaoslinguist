<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to ChaosLinguist">
    <title>Login - ChaosLinguist</title>
    
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <!-- Background Effects -->
    <div class="background-container">
        <canvas id="particleCanvas"></canvas>
        <div class="aurora-bg"></div>
        <div class="floating-orbs">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>
        <div class="scan-lines"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card glass">
            <div class="auth-header">
                <div class="logo">
                    <span class="logo-icon">◆</span>
                    <span class="logo-text">ChaosLinguist</span>
                </div>
                <h1>Welcome Back</h1>
                <p>Enter the linguistic chaos</p>
            </div>

            <form class="auth-form" id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="you@example.com" 
                            required
                            autocomplete="email"
                        >
                        <span class="input-focus-glow"></span>
                    </div>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••" 
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                            <span class="eye-icon">👁️</span>
                        </button>
                        <span class="input-focus-glow"></span>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-large btn-primary login-btn" id="loginBtn">
                    <span class="btn-text">Login</span>
                    <span class="btn-loader"></span>
                </button>

                <div class="auth-divider">
                    <span>or</span>
                </div>

                <button type="button" class="btn btn-large btn-secondary social-btn">
                    <span>🔗 Continue with GitHub</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
            </div>
        </div>

        <!-- Success Message -->
        <div class="auth-success" id="successMessage">
            <div class="success-icon">✓</div>
            <p>Login successful! Redirecting...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/particles.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const togglePasswordBtn = document.querySelector('.toggle-password');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const successMessage = document.getElementById('successMessage');

            // Toggle password visibility
            togglePasswordBtn.addEventListener('click', function() {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                this.textContent = type === 'password' ? '👁️' : '🙈';
            });

            // Form submission
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                let isValid = true;

                // Validate email
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    document.getElementById('emailError').textContent = 'Please enter a valid email';
                    isValid = false;
                } else {
                    document.getElementById('emailError').textContent = '';
                }

                // Validate password
                if (password.length < 6) {
                    document.getElementById('passwordError').textContent = 'Password must be at least 6 characters';
                    isValid = false;
                } else {
                    document.getElementById('passwordError').textContent = '';
                }

                if (!isValid) return;

                // Show loading state
                loginBtn.disabled = true;
                loginBtn.classList.add('loading');

                // Simulate login
                setTimeout(() => {
                    successMessage.classList.add('show');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                }, 1000);
            });
        });
    </script>
</body>
</html>
